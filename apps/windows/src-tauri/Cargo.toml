[package]
name = "lockguard"
version = "0.7.3"
description = "LockGuard Secure Password Manager"
authors = ["LockGuard"]
edition = "2021"

[lib]
name = "lockguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
