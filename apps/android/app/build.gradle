plugins { id 'com.android.application' }

android {
    namespace 'com.lockguard.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lockguard.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.0.2'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // A camada nativa não duplica a criptografia do cofre.
    // O engine Web 0.7.3 executa Argon2id/AES-GCM, reduzindo tamanho e consumo do APK.
}
