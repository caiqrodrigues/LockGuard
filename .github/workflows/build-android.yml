name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APKs
        working-directory: apps/android
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p release/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk release/android/LockGuard-v0.7.03-debug.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk release/android/LockGuard-v0.7.03-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LockGuard-Android-v0.7.03
          path: release/android/*.apk
          if-no-files-found: error
