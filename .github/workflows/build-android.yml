name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: lockguard-android-main
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore stable Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: apps/android/lockguard-debug.keystore
          key: lockguard-android-debug-signing-v2

      - name: Create signing key when missing
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore apps/android/lockguard-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LockGuard Android Debug,O=LockGuard,C=BR"

      - name: Prepare embedded Web 0.7.4 engine
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="apps/android/app/src/main/assets/web"
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp apps/web/index.html apps/web/style.css apps/web/app.js apps/web/account.js apps/web/argon2.umd.min.js apps/web/favicon.svg "$ASSETS/"
          if [ -f apps/web/og-image.png ]; then cp apps/web/og-image.png "$ASSETS/"; fi
          python3 - <<'PY'
          from pathlib import Path
          root=Path('apps/android/app/src/main/assets/web')
          idx=root/'index.html'
          s=idx.read_text(encoding='utf-8')
          s=s.replace('href="/style.css"','href="style.css"')
          s=s.replace('href="/favicon.svg"','href="favicon.svg"')
          s=s.replace('src="/argon2.umd.min.js"','src="argon2.umd.min.js"')
          s=s.replace('src="/app.js"','src="app.js"')
          if 'account.js' not in s:
              s=s.replace('<script src="app.js"></script>','<script src="app.js"></script>\n<script src="account.js"></script>')
          s=s.replace('Versão 0.7.02','Versão 0.7.4')
          idx.write_text(s,encoding='utf-8')
          app=root/'app.js'
          a=app.read_text(encoding='utf-8')
          a=a.replace("const APP_VERSION='0.7.02';","const APP_VERSION='0.7.4';")
          a=a.replace("encodeURIComponent(location.origin)","encodeURIComponent('https://lockguardapp.vercel.app')")
          app.write_text(a,encoding='utf-8')
          PY
          test -s "$ASSETS/account.js"
          grep -q 'account.js' "$ASSETS/index.html"
          grep -q "APP_VERSION='0.7.4'" "$ASSETS/app.js"

      - name: Build APKs
        id: build
        shell: bash
        working-directory: apps/android
        run: |
          set +e
          gradle clean assembleDebug assembleRelease --stacktrace 2>&1 | tee ../../android-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Validate installable APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee android-apk-validation.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee -a android-apk-validation.txt
          grep -q "package: name='com.lockguard.app'" android-apk-validation.txt
          grep -q "versionName='0.0.4'" android-apk-validation.txt
          grep -q "CN=LockGuard Android Debug" android-apk-validation.txt
          unzip -l "$APK" | grep -q 'assets/web/account.js'
          unzip -l "$APK" | grep -q 'assets/web/index.html'
          echo "EMBEDDED_WEB_VERSION=0.7.4" | tee -a android-apk-validation.txt
          echo "ACCOUNT_MANAGER=embedded" | tee -a android-apk-validation.txt
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" | tee -a android-apk-validation.txt
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" | tee -a android-apk-validation.txt

      - name: Collect APKs
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          mkdir -p release/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk release/android/LockGuard-v0.0.4-debug.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk release/android/LockGuard-v0.0.4-unsigned.apk
          cp android-apk-validation.txt release/android/VALIDATION.txt

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: LockGuard-Android-v0.0.4
          path: release/android/*
          if-no-files-found: error

      - name: Persist build status
        if: always()
        shell: bash
        run: |
          mkdir -p ci-status
          outcome="${{ steps.build.outcome }}"
          exit_code="${{ steps.build.outputs.exit_code }}"
          {
            echo "workflow=Build Android"
            echo "version=0.0.4"
            echo "web_version=0.7.4"
            echo "account_manager=embedded"
            echo "commit=${GITHUB_SHA}"
            echo "outcome=${outcome}"
            echo "exit_code=${exit_code}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-status/android-latest.txt
          if [ -f android-build.log ]; then
            tail -n 160 android-build.log > ci-status/android-build-tail.txt
            grep -Ei "error:|FAILURE:|What went wrong|Execution failed|Android resource linking failed|AAPT|MainActivity.java|Manifest merger failed|Could not resolve" android-build.log | head -n 120 > ci-status/android-build-errors.txt || true
          fi
          if [ -f android-apk-validation.txt ]; then
            cp android-apk-validation.txt ci-status/android-apk-validation.txt
          fi
          git config user.name "LockGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add ci-status || true
          if ! git diff --cached --quiet; then
            git commit -m "ci(android): record validated build [skip ci]"
            git push || true
          fi
