name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Normalize Android source imports
        shell: bash
        run: |
          sed -i 's/((ClipboardManager)/((android.content.ClipboardManager)/g' apps/android/app/src/main/java/com/lockguard/app/MainActivity.java

      - name: Build APKs
        id: build
        shell: bash
        working-directory: apps/android
        run: |
          set +e
          gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee ../../android-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Collect APKs
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p release/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk release/android/LockGuard-v0.0.2-debug.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk release/android/LockGuard-v0.0.2-unsigned.apk

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: LockGuard-Android-v0.0.2
          path: release/android/*.apk
          if-no-files-found: error

      - name: Persist build status
        if: always()
        shell: bash
        run: |
          mkdir -p ci-status
          outcome="${{ steps.build.outcome }}"
          exit_code="${{ steps.build.outputs.exit_code }}"
          {
            echo "workflow=Build Android"
            echo "version=0.0.2"
            echo "commit=${GITHUB_SHA}"
            echo "outcome=${outcome}"
            echo "exit_code=${exit_code}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-status/android-latest.txt
          if [ -f android-build.log ]; then
            tail -n 160 android-build.log > ci-status/android-build-tail.txt
            grep -Ei "error:|FAILURE:|What went wrong|Execution failed|Android resource linking failed|AAPT|MainActivity.java|Manifest merger failed|Could not resolve" android-build.log | head -n 120 > ci-status/android-build-errors.txt || true
            head -n 220 android-build.log > ci-status/android-build-head.txt
          fi
          git config user.name "LockGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add ci-status/android-latest.txt ci-status/android-build-tail.txt ci-status/android-build-errors.txt ci-status/android-build-head.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "ci(android): record build status [skip ci]"
            git push
          fi
