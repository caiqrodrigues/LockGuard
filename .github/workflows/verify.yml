name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/browser-extension/service-worker.js
          node --check apps/browser-extension/content.js
          node --check apps/browser-extension/popup.js
      - name: Prepare desktop frontend
        run: node scripts/prepare-windows.mjs
      - name: Confirm Windows frontend
        run: test -f apps/windows/frontend/index.html
